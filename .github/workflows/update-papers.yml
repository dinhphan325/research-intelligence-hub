name: Update journal publications and grants
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: pip install beautifulsoup4 pandas openpyxl xlrd
      - name: Verify official ABDC workbook when provided
        run: python scripts/verify_abdc.py
      - name: Update publications
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update.py
      - name: Check ARC calendar for grants
        run: python scripts/update_grants.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          git diff --cached --quiet || (git commit -m 'Refresh papers, grants and journal verification' && git push)
