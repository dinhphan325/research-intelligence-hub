name: Update academic grants V3
on:
  workflow_dispatch:
  schedule:
    - cron: '35 3 * * *'
permissions:
  contents: write
jobs:
  grants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free parser
        run: python -m pip install beautifulsoup4
      - name: Monitor official funding sources
        run: python scripts/update_grants_v3.py
      - name: Commit new grant records and monitoring health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grants_v3.json data/grant_source_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update academic grants V3'
            git push
          fi
